services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-ledger-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ledger-network

  redis:
    image: redis:7-alpine
    container_name: backend-ledger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ledger-network

volumes:
  redis-data:

networks:
  ledger-network:
    driver: bridge
